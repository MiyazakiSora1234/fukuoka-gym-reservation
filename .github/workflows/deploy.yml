# main に push したら AWS にデプロイする。AWS へは鍵を置かず OIDC でつなぐ
name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      richmenu:
        description: リッチメニューも作り直す
        type: boolean
        default: false

permissions:
  id-token: write
  contents: read

concurrency: deploy

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 2

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npm run typecheck

      - uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: arn:aws:iam::125192672369:role/fukuoka-gym-reservation-github-deploy
          aws-region: ap-northeast-1

      - run: npm run deploy

      - name: リッチメニュー（メニューの画像や項目が変わったときだけ）
        run: |
          if [ "${{ inputs.richmenu }}" = "true" ] || git diff --name-only HEAD^ HEAD | grep -qE '^(assets/richmenu\.png|scripts/richmenu\.ts)$'; then
            npm run richmenu
          else
            echo "変更なし"
          fi
